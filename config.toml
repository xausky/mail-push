[providers.163]
name = "网易 163.com"
email_suffix = "@163.com"
smtp_host = "smtp.163.com"
smtp_port = 465

[providers.qq]
name = "QQ qq.com"
email_suffix = "@qq.com"
smtp_host = "smtp.qq.com"
smtp_port = 465

# Webhook 格式配置
[formats.send]
name = "企业微信"
docment_url = "https://developer.work.weixin.qq.com/document/path/91770"
title_template = "{{.summary__}}" # summary__ 就是 content 渲染结果的纯本提取
content_template = """
{{if eq .msgtype "text"}}
<p>{{.text.content}}</p>
{{end}}
{{if eq .msgtype "image"}}
<h2>Image Message - {{.time__}}</h2>
<img src='data:image/png;base64,{{.image.base64}}' alt='Image Message'/>
{{end}}
{{if eq .msgtype "markdown"}}
{{.markdown.content | renderMarkdown }}
{{end}}
{{if eq .msgtype "news"}}
    <ul>
    {{range .news.articles }}
        <li><a href='{{.url}}'><img src='{{.picurl}}' alt='{{.title}}'></a><p>{{.description}}</p></li>
    {{end}}
    </ul>
{{end}}
"""
response_template = """
{{if .error__}}
{
  "errcode": 40003,
  "errmsg":  "{{.error__}}"
}
{{else}}
{
  "errcode": 0,
  "errmsg":  "ok"
}
{{end}}
"""

# Discord 格式配置
[formats.discord]
name = "Discord"
docment_url = "https://discord.com/developers/docs/resources/webhook#execute-webhook"
title_template = "{{if .username}}message from {{.username}}{{else}}discord message{{end}}"
content_template = """
<h2>{{if .username}}message from {{.username}}{{else}}discord message{{end}}</h2>
{{range .embeds}}
<div>
    <h3>{{.title}}</h3>
    <p>{{.description}}</p>
</div>
{{end}}
"""
response_template = """
{{if .error__}}
{
  "code": 400,
  "message":  "{{.error__}}",
  "time": "{{.time__}}"
}
{{else}}
{
  "code": 200,
  "time": "{{.time__}}"
}
{{end}}
"""